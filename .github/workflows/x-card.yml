# The image for the daily X post, rendered 90 minutes before it sends
# (/api/cron/x-post runs at 14:00 UTC). Runs on GitHub's free minutes,
# never on the Worker.
name: X post card
on:
  schedule:
    - cron: '30 12 * * *'
  workflow_dispatch:
concurrency: x-card
jobs:
  card:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: npx puppeteer browsers install chrome
      - name: Render card
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: bun scripts/x-card.ts
