# Link cards for sites added since the last run (the /site/ page's og:image).
# Runs on GitHub's free minutes, never on the Worker.
name: Site cards
on:
  schedule:
    - cron: '30 12 * * *'
  workflow_dispatch:
concurrency: site-cards
jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: npx puppeteer browsers install chrome
      - name: Render cards
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: bun scripts/site-cards.ts
