name = "hitmans-library-cron"
main = "worker.ts"
compatibility_date = "2026-11-04"

# Calls the app worker directly; no public URL, no DNS dependency.
[[services]]
binding = "APP"
service = "hitmans-library"

[triggers]
# Mondays 08:00 UTC — the weekly taste-radar digest.
# Every day 14:00 UTC — the daily X post.
crons = ["0 8 * * 1", "0 14 * * *"]
